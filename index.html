<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>XIST — Captured Moment</title>

<!-- ═══════════════════════════════════════════════════════════
     ▼▼▼ 여기만 수정하세요 (CONFIG) ▼▼▼
     ═══════════════════════════════════════════════════════════ -->
<script>
  const CONFIG = {
    // R2 버킷 공개 주소 (끝에 / 없이). pipeline.py의 R2_PUBLIC_BASE와 반드시 동일!
    R2_BASE: "https://pub-XXXXXXXXXXXX.r2.dev",
    EXT: ".mp4",
    DOWNLOAD_PREFIX: "XIST_",          // 저장 파일명 접두어
    INSTAGRAM: "hydn_tmd",             // 인스타 아이디 (@ 없이)
  };
</script>
<!-- ═══════════════════════════════════════════════════════════
     ▲▲▲ CONFIG 끝 ▲▲▲
     ═══════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>

<style>
  :root{
    --bg:#000005;
    --text:#F2F5F5;
    --muted:#8A9291;
    --cyan:#1FE0DC;
    --line:rgba(255,255,255,.14);
    --frame:rgba(31,224,220,.16);
    --glow:rgba(31,224,220,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html{-webkit-text-size-adjust:100%}
  html,body{background:var(--bg)}
  body{color:var(--text);font-family:"Space Grotesk","Pretendard Variable",Pretendard,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}

  /* 터치 잉크 번짐 캔버스 (배경 파티클은 제거, 터치 효과만 유지) */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  .wrap{position:relative;z-index:2;width:100%;max-width:460px;margin:0 auto;
    display:flex;flex-direction:column;
    padding:max(24px,env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));
    gap:22px}

  /* 상단 로고 */
  .logo{display:flex;justify-content:center;align-items:center;min-height:54px;padding:4px 0 2px}
  .logo img{max-height:52px;max-width:70%;object-fit:contain}
  .logo .fallback{font-weight:700;font-size:32px;letter-spacing:.18em;
    color:var(--text);text-shadow:0 0 24px var(--glow)}

  /* 영상 프레임 */
  .frame{position:relative;border-radius:16px;overflow:hidden;background:#000;
    aspect-ratio:16/9;border:1px solid var(--frame);
    box-shadow:0 18px 55px -22px rgba(31,224,220,.28), inset 0 0 40px rgba(31,224,220,.04)}
  .frame video{width:100%;height:100%;object-fit:cover;display:block}
  .frame .fallback{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;
    align-items:center;justify-content:center;color:var(--muted);
    font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;text-align:center;padding:20px}
  .frame.error .fallback{display:flex}
  .frame.error video{opacity:0}
  .corner{position:absolute;bottom:12px;font-family:"Space Mono",monospace;font-size:12px;
    letter-spacing:.06em;color:#dffcfb;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .corner.l{left:14px}
  .corner.r{right:14px}

  .divider{height:1px;background:var(--line);width:100%}

  /* 전시 텍스트 */
  .section h2{font-weight:700;font-size:24px;letter-spacing:.02em;margin-bottom:12px}
  .section p{color:var(--muted);font-size:14px;line-height:1.6;font-weight:400}
  .section .rows{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:14px;line-height:1.55}
  .credit{margin-top:16px}
  .credit a{display:inline-block;color:var(--text);font-weight:600;font-size:15px;
    text-decoration:none;letter-spacing:.01em}
  .credit a .handle{color:var(--cyan)}
  .credit a:active{opacity:.6}

  .spacer{flex:1;min-height:10px}

  /* 우하단 액션 */
  .actions{display:flex;flex-direction:column;gap:16px;align-items:flex-end;margin-top:4px}
  .act{display:inline-flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;
    color:var(--text);font-family:inherit;font-size:18px;font-weight:500;letter-spacing:.02em;padding:2px}
  .act:active{opacity:.55}
  .act svg{width:22px;height:22px}
  .act.busy{opacity:.5;pointer-events:none}
  .spin{width:18px;height:18px;border:2px solid rgba(242,245,245,.3);border-top-color:var(--text);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 빈 상태 */
  .state{position:relative;z-index:2;max-width:460px;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 30px;gap:8px}
  .state .fallback{font-weight:700;font-size:34px;letter-spacing:.18em;text-shadow:0 0 24px var(--glow)}
  .state .code{margin-top:20px;font-family:"Space Mono",monospace;font-size:11px;
    letter-spacing:.26em;color:var(--cyan);text-transform:uppercase}
  .state h1{margin-top:14px;font-weight:500;font-size:20px}
  .state p{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.5}

  @media (max-width:360px){.section h2{font-size:21px}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:0s}}
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <main id="app"></main>

<script>
/* ── 터치 잉크 번짐 (배경 파티클 제거, 터치 효과만) ─────────── */
(function(){
  const canvas=document.getElementById("bg");
  const ctx=canvas.getContext("2d");
  let W,H,DPR,RAD,raf;
  const ripples=[];
  const pointer={x:0,y:0,active:false};
  let lastRx=0,lastRy=0;

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=canvas.clientWidth=window.innerWidth;
    H=canvas.clientHeight=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    RAD=Math.min(W,H)*0.55;
  }
  function spawn(x,y,a){ ripples.push({x,y,r:6,a}); if(ripples.length>16) ripples.shift(); lastRx=x; lastRy=y; }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(let i=ripples.length-1;i>=0;i--){
      const rp=ripples[i];
      rp.r += (RAD*1.15 - rp.r)*0.018;   // 천천히 커짐
      rp.a *= 0.972;                      // 여운 길게
      if(rp.a<0.008){ ripples.splice(i,1); continue; }
      const g=ctx.createRadialGradient(rp.x,rp.y,0, rp.x,rp.y,rp.r);
      g.addColorStop(0,   `rgba(150,255,252,${rp.a*1.0})`);
      g.addColorStop(0.25,`rgba(60,242,238,${rp.a*0.6})`);
      g.addColorStop(0.55,`rgba(31,224,220,${rp.a*0.3})`);
      g.addColorStop(1,   `rgba(31,224,220,0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.r,0,6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation="source-over";
    raf=requestAnimationFrame(draw);
  }
  function setP(e){ const s=e.touches?e.touches[0]:e; if(!s)return; pointer.x=s.clientX; pointer.y=s.clientY; }
  window.addEventListener("pointerdown", e=>{ setP(e); pointer.active=true; spawn(pointer.x,pointer.y,1.5); }, {passive:true});
  window.addEventListener("pointermove", e=>{ setP(e);
    if(pointer.active){ const dx=pointer.x-lastRx, dy=pointer.y-lastRy;
      if(dx*dx+dy*dy > 24*24) spawn(pointer.x,pointer.y,0.5); }
  }, {passive:true});
  window.addEventListener("pointerup", ()=>{ pointer.active=false; }, {passive:true});
  window.addEventListener("pointercancel", ()=>{ pointer.active=false; }, {passive:true});
  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) cancelAnimationFrame(raf); else draw(); });
  resize(); draw();
})();

/* ── 페이지 로직 ─────────────────────────────────────────── */
const app=document.getElementById("app");
const vid=new URLSearchParams(location.search).get("v");
const valid=vid && /^[A-Za-z0-9_-]{1,64}$/.test(vid);
const IG=`https://www.instagram.com/${CONFIG.INSTAGRAM}`;

// 로고: logo.png 있으면 표시, 없으면 텍스트 "XIST"
const logoHTML = `
  <div class="logo">
    <img src="logo.png" alt="XIST" onerror="this.remove();document.getElementById('lf').style.display='block'">
    <span class="fallback" id="lf" style="display:none">XIST</span>
  </div>`;

if(!valid){
  document.querySelector("main").outerHTML = `
    <div class="state">
      <span class="fallback">XIST</span>
      <div class="code">No Signal · 404</div>
      <h1>영상을 찾을 수 없어요</h1>
      <p>영수증의 QR 코드를 다시 스캔해 주세요.</p>
    </div>`;
} else {
  const url=`${CONFIG.R2_BASE}/${vid}${CONFIG.EXT}`;
  const filename=`${CONFIG.DOWNLOAD_PREFIX}${vid}${CONFIG.EXT}`;

  app.className="wrap";
  app.innerHTML = `
    ${logoHTML}

    <div class="frame" id="frame">
      <video id="v" src="${url}" autoplay muted loop playsinline preload="auto"></video>
      <div class="fallback">미리보기를 불러올 수 없습니다<br>아래 Download로 저장해 보세요</div>
      <div class="corner l" id="tc">00:00</div>
      <div class="corner r">${vid}</div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <h2>XIST</h2>
      <p>XIST는 가상의 앨범 브랜딩 디자인이자, 음악과 그래픽을 결합한 인터랙티브 미디어아트입니다. Exist라는 단어에서 추출한 XIST는 사람의 기록하려는 습관에서 출발해, 자신이 남긴 기록들이 곧 자신이 존재한다는 증거가 된다는 의미를 가지고 있습니다.</p>
    </div>

    <div class="divider"></div>

    <div class="section">
      <h2>EXHIBITION</h2>
      <div class="rows">
        <span>Sungkyunkwan University</span>
        <span>디자인학회 MoD</span>
        <span>[생활채록]</span>
      </div>
      <div class="credit">
        <a href="${IG}" target="_blank" rel="noopener">김현우 <span class="handle">@${CONFIG.INSTAGRAM}</span></a>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="actions">
      <button class="act" id="dl">Download
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
      </button>
      <button class="act" id="share">Share
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L8 7m4-4l4 4M6 12v7a1 1 0 001 1h10a1 1 0 001-1v-7"/></svg>
      </button>
    </div>`;

  const frame=document.getElementById("frame");
  const v=document.getElementById("v");
  const tc=document.getElementById("tc");

  v.addEventListener("timeupdate", ()=>{ tc.textContent="00:"+String(Math.floor(v.currentTime)).padStart(2,"0"); });
  v.addEventListener("error", ()=>{ frame.classList.add("error"); });

  // 저장: blob 강제 다운로드 → 실패 시 새 탭
  const dl=document.getElementById("dl");
  const orig=dl.innerHTML;
  dl.addEventListener("click", async ()=>{
    dl.classList.add("busy"); dl.innerHTML=`<span class="spin"></span>`;
    try{
      const res=await fetch(url); if(!res.ok) throw new Error(res.status);
      const blob=await res.blob();
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download=filename;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
      dl.innerHTML=`Saved ✓`;
    }catch(e){ window.open(url,"_blank"); dl.innerHTML=`Opened`; }
    finally{ setTimeout(()=>{ dl.classList.remove("busy"); dl.innerHTML=orig; },2200); }
  });

  // 공유
  const share=document.getElementById("share");
  const sOrig=share.innerHTML;
  share.addEventListener("click", async ()=>{
    if(navigator.share){ try{ await navigator.share({title:"XIST", url:location.href}); }catch(e){} }
    else{ try{ await navigator.clipboard.writeText(location.href); share.innerHTML="Copied ✓"; setTimeout(()=>share.innerHTML=sOrig,1600); }catch(e){} }
  });
}
</script>
</body>
</html>
